name: CI Static Analysis + SonarQube

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create minimal project for analysis
        run: |
          New-Item -ItemType Directory -Force -Path TempAnalysis
          dotnet new classlib -o TempAnalysis --force
          Copy-Item Assets\Scripts\Tools\ColorMapEnum.cs TempAnalysis\ColorMapEnum.cs

      - name: Run static analysis
        run: dotnet build TempAnalysis --no-incremental /warnaserror

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}